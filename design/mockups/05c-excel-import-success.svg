<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>05c — Excel upload: import success</title>

  <rect width="375" height="812" fill="#F8FAFB"/>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Top app bar -->
  <g transform="translate(0, 56)">
    <text x="24" y="20" font-size="17" font-weight="600" fill="#0F1F2E">Trip imported</text>
    <text x="24" y="38" font-size="13" fill="#5A6B7A">Step 3 of 3</text>
  </g>

  <!-- Stepper full -->
  <g transform="translate(24, 122)">
    <rect width="327" height="4" rx="2" fill="#E5EBF0"/>
    <rect width="327" height="4" rx="2" fill="#2DA771"/>
  </g>

  <!-- Success illustration -->
  <g transform="translate(187.5, 200)">
    <circle cx="0" cy="0" r="56" fill="#2DA771" opacity="0.12"/>
    <circle cx="0" cy="0" r="40" fill="#2DA771"/>
    <polyline points="-14,0 -4,10 14,-10" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Heading -->
  <g transform="translate(187.5, 310)" text-anchor="middle">
    <text font-size="24" font-weight="700" fill="#0F1F2E">All set!</text>
    <text y="30" font-size="15" fill="#5A6B7A">Your trip is ready to plan.</text>
  </g>

  <!-- Summary card -->
  <g transform="translate(24, 380)">
    <rect width="327" height="208" rx="20" fill="#FFFFFF"/>

    <!-- Trip header -->
    <g transform="translate(20, 20)">
      <rect width="48" height="48" rx="12" fill="#0E7C7B"/>
      <text x="24" y="32" text-anchor="middle" font-size="22">🌍</text>
    </g>
    <text x="84" y="42" font-size="17" font-weight="600" fill="#0F1F2E">Budapest → Prague → Croatia</text>
    <text x="84" y="60" font-size="13" fill="#5A6B7A">Jun 14 – Jun 26, 2026 · 13 days</text>

    <!-- Stat row -->
    <g transform="translate(20, 100)" font-size="13">
      <g>
        <text font-size="22" font-weight="700" fill="#0F1F2E">41</text>
        <text y="20" font-size="12" fill="#5A6B7A">items</text>
      </g>
      <g transform="translate(80, 0)">
        <text font-size="22" font-weight="700" fill="#0F1F2E">38</text>
        <text y="20" font-size="12" fill="#5A6B7A">places</text>
      </g>
      <g transform="translate(160, 0)">
        <text font-size="22" font-weight="700" fill="#0F1F2E">3</text>
        <text y="20" font-size="12" fill="#5A6B7A">currencies</text>
      </g>
      <g transform="translate(252, 0)">
        <text font-size="22" font-weight="700" fill="#0F1F2E">1</text>
        <text y="20" font-size="12" fill="#5A6B7A">traveler</text>
      </g>
    </g>

    <!-- Currency chips -->
    <g transform="translate(20, 160)">
      <g>
        <rect width="56" height="28" rx="14" fill="#EDF2F5"/>
        <text x="28" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#0F1F2E">HUF</text>
      </g>
      <g transform="translate(64, 0)">
        <rect width="56" height="28" rx="14" fill="#EDF2F5"/>
        <text x="28" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#0F1F2E">CZK</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="56" height="28" rx="14" fill="#EDF2F5"/>
        <text x="28" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#0F1F2E">EUR</text>
      </g>
    </g>
  </g>

  <!-- Invite collaborators hint -->
  <g transform="translate(24, 612)">
    <rect width="327" height="64" rx="12" fill="#FFFFFF" stroke="#E5EBF0"/>
    <g transform="translate(16, 16)">
      <circle cx="16" cy="16" r="16" fill="#FF7A59" opacity="0.14"/>
      <g transform="translate(8, 8)" stroke="#FF7A59" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="6" r="4"/>
        <path d="M2 16 q0 -6 6 -6 t6 6"/>
        <line x1="14" y1="3" x2="14" y2="9"/>
        <line x1="11" y1="6" x2="17" y2="6"/>
      </g>
    </g>
    <text x="68" y="32" font-size="14" font-weight="600" fill="#0F1F2E">Plan with friends?</text>
    <text x="68" y="50" font-size="12" fill="#5A6B7A">Invite Anna, James &amp; Leo to co-edit.</text>
    <g transform="translate(290, 32)" stroke="#92A1AE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="0,0 8,8 0,16"/>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(0, 692)">
    <rect width="375" height="86" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E5EBF0"/>
    <g transform="translate(24, 20)">
      <rect width="327" height="56" rx="12" fill="#0E7C7B"/>
      <text x="163.5" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Open the trip on the map</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
