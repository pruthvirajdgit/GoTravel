<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>08 — Trip detail: map-first view</title>

  <!-- Map background -->
  <defs>
    <linearGradient id="mapBg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE8E6"/>
      <stop offset="1" stop-color="#C4D8D7"/>
    </linearGradient>
    <pattern id="mapGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0 L 40 0 M0 0 L 0 40" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="375" height="812" fill="url(#mapBg8)"/>
  <rect width="375" height="812" fill="url(#mapGrid)"/>

  <!-- Park / water shapes -->
  <path d="M-20 280 Q60 240 140 270 T320 290 L395 320 v100 H-20 Z" fill="#B6D6D4" opacity="0.7"/>
  <path d="M50 480 Q120 450 180 470 T340 460 L395 480 v60 H-20 V500 Z" fill="#C6DCDA" opacity="0.6"/>
  <!-- River -->
  <path d="M0 380 Q80 360 140 420 Q200 480 280 450 Q340 430 380 460" stroke="#9DC3E6" stroke-width="14" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- Roads -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.7" fill="none" stroke-linecap="round">
    <path d="M-10 200 L200 280 L380 230"/>
    <path d="M40 100 L120 320 L200 580"/>
    <path d="M280 100 L260 380 L320 620"/>
    <path d="M-10 540 L160 580 L380 540"/>
  </g>

  <!-- Route polyline -->
  <path d="M90 280 L150 320 L210 360 L260 410 L210 470 L160 500 L120 540" stroke="#0E7C7B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Map pins -->
  <g>
    <!-- Hotel (Day 1) -->
    <g transform="translate(80, 256)">
      <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#0E7C7B"/>
      <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
      <path d="M12 18 v-3 h8 v3 z" fill="#0E7C7B"/>
    </g>
    <!-- Restaurant -->
    <g transform="translate(140, 296)">
      <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#FF7A59"/>
      <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
      <text x="16" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#FF7A59">🍴</text>
    </g>
    <!-- Activity (Baths) - selected -->
    <g transform="translate(200, 336)">
      <circle cx="16" cy="16" r="26" fill="#0E7C7B" opacity="0.2"/>
      <circle cx="16" cy="16" r="20" fill="#0E7C7B" opacity="0.35"/>
      <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#2DA771"/>
      <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
      <text x="16" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#2DA771">★</text>
    </g>
    <!-- Landmark -->
    <g transform="translate(250, 386)">
      <path d="M0 14 a14 14 0 1 1 28 0 c0 11 -14 28 -14 28 s-14 -18 -14 -28z" fill="#F2A93B"/>
      <circle cx="14" cy="14" r="6" fill="#FFFFFF"/>
    </g>
    <!-- Train -->
    <g transform="translate(202, 446)">
      <path d="M0 14 a14 14 0 1 1 28 0 c0 11 -14 28 -14 28 s-14 -18 -14 -28z" fill="#7C5CE6"/>
      <circle cx="14" cy="14" r="6" fill="#FFFFFF"/>
    </g>
    <!-- Hotel (Prague) -->
    <g transform="translate(152, 478)">
      <path d="M0 14 a14 14 0 1 1 28 0 c0 11 -14 28 -14 28 s-14 -18 -14 -28z" fill="#0E7C7B"/>
      <circle cx="14" cy="14" r="6" fill="#FFFFFF"/>
    </g>
    <!-- Restaurant -->
    <g transform="translate(112, 518)">
      <path d="M0 12 a12 12 0 1 1 24 0 c0 9 -12 24 -12 24 s-12 -16 -12 -24z" fill="#FF7A59"/>
      <circle cx="12" cy="12" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Clustered pin -->
    <g transform="translate(58, 460)">
      <circle cx="14" cy="14" r="16" fill="#FFFFFF"/>
      <circle cx="14" cy="14" r="14" fill="#0E7C7B"/>
      <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">+7</text>
    </g>
  </g>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Floating top bar -->
  <g transform="translate(16, 56)">
    <rect width="343" height="56" rx="16" fill="#FFFFFF" filter="url(#shadow8)"/>
    <defs>
      <filter id="shadow8" x="-10%" y="-10%" width="120%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F1F2E" flood-opacity="0.10"/>
      </filter>
    </defs>
    <!-- Back -->
    <g transform="translate(16, 20)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,4 4,14 14,24"/>
    </g>
    <text x="46" y="26" font-size="15" font-weight="600" fill="#0F1F2E">Budapest → Croatia</text>
    <text x="46" y="42" font-size="12" fill="#5A6B7A">13 days · 41 items</text>

    <!-- Sync ok dot -->
    <g transform="translate(244, 28)">
      <circle cx="0" cy="0" r="3" fill="#2DA771"/>
      <text x="8" y="4" font-size="11" font-weight="600" fill="#2DA771">Synced</text>
    </g>

    <!-- Share -->
    <g transform="translate(308, 16)" stroke="#0F1F2E" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="3"/>
      <circle cx="18" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <line x1="8.5" y1="7" x2="15.5" y2="6.5"/>
      <line x1="8.5" y1="17" x2="15.5" y2="7.5"/>
    </g>
  </g>

  <!-- Day chip selector -->
  <g transform="translate(16, 128)">
    <!-- Scroll bar -->
    <g>
      <!-- Day 1 -->
      <g>
        <rect width="64" height="56" rx="12" fill="#FFFFFF"/>
        <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6B7A">DAY 1</text>
        <text x="32" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0F1F2E">Jun 14</text>
      </g>
      <!-- Day 2 -->
      <g transform="translate(72, 0)">
        <rect width="64" height="56" rx="12" fill="#FFFFFF"/>
        <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6B7A">DAY 2</text>
        <text x="32" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0F1F2E">Jun 15</text>
      </g>
      <!-- Day 3 selected -->
      <g transform="translate(144, 0)">
        <rect width="64" height="56" rx="12" fill="#0E7C7B"/>
        <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.8">DAY 3</text>
        <text x="32" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Jun 16</text>
      </g>
      <!-- Day 4 -->
      <g transform="translate(216, 0)">
        <rect width="64" height="56" rx="12" fill="#FFFFFF"/>
        <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6B7A">DAY 4</text>
        <text x="32" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0F1F2E">Jun 17</text>
      </g>
      <!-- Day 5 partial -->
      <g transform="translate(288, 0)">
        <rect width="64" height="56" rx="12" fill="#FFFFFF" opacity="0.85"/>
        <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6B7A">DAY 5</text>
        <text x="32" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#0F1F2E">Jun 18</text>
      </g>
    </g>
    <!-- All days pill -->
    <g transform="translate(0, 64)">
      <rect width="80" height="32" rx="16" fill="#0F1F2E"/>
      <text x="40" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">All 13 days</text>
    </g>
  </g>

  <!-- Map controls -->
  <g transform="translate(327, 240)">
    <rect width="32" height="64" rx="12" fill="#FFFFFF"/>
    <line x1="6" y1="32" x2="26" y2="32" stroke="#E5EBF0"/>
    <g stroke="#0F1F2E" stroke-width="2" stroke-linecap="round">
      <line x1="11" y1="16" x2="21" y2="16"/>
      <line x1="16" y1="11" x2="16" y2="21"/>
    </g>
    <g transform="translate(0, 32)" stroke="#0F1F2E" stroke-width="2" stroke-linecap="round">
      <line x1="11" y1="16" x2="21" y2="16"/>
    </g>
  </g>
  <g transform="translate(327, 316)">
    <rect width="32" height="32" rx="12" fill="#FFFFFF"/>
    <g transform="translate(8, 8)" stroke="#0E7C7B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="3"/>
      <line x1="8" y1="0" x2="8" y2="3"/>
      <line x1="8" y1="13" x2="8" y2="16"/>
      <line x1="0" y1="8" x2="3" y2="8"/>
      <line x1="13" y1="8" x2="16" y2="8"/>
    </g>
  </g>

  <!-- Bottom sheet (peek) - Day 3 -->
  <g transform="translate(0, 568)">
    <rect width="375" height="244" rx="24" fill="#FFFFFF" filter="url(#shadowSheet)"/>
    <defs>
      <filter id="shadowSheet" x="-5%" y="-30%" width="110%" height="120%">
        <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#0F1F2E" flood-opacity="0.10"/>
      </filter>
    </defs>
    <!-- Grabber -->
    <rect x="167.5" y="8" width="40" height="4" rx="2" fill="#E5EBF0"/>

    <!-- Day header -->
    <g transform="translate(24, 28)">
      <text font-size="20" font-weight="700" fill="#0F1F2E">Day 3 · Budapest</text>
      <text y="22" font-size="13" fill="#5A6B7A">Tue Jun 16 · 4 items · €68 planned</text>
    </g>

    <!-- Item 1 -->
    <g transform="translate(24, 96)">
      <rect width="327" height="60" rx="12" fill="#F8FAFB"/>
      <!-- time chip -->
      <text x="12" y="22" font-size="11" font-weight="700" fill="#5A6B7A">09:00</text>
      <text x="12" y="40" font-size="10" fill="#92A1AE">1h</text>
      <!-- icon -->
      <g transform="translate(56, 18)">
        <circle cx="12" cy="12" r="12" fill="#2DA771" opacity="0.18"/>
        <text x="12" y="16" text-anchor="middle" font-size="12" fill="#2DA771">★</text>
      </g>
      <text x="92" y="26" font-size="14" font-weight="600" fill="#0F1F2E">Széchenyi Thermal Baths</text>
      <text x="92" y="44" font-size="12" fill="#5A6B7A">12,000 HUF · Booked</text>
      <!-- status dot -->
      <circle cx="306" cy="30" r="4" fill="#2DA771"/>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 164)">
      <rect width="327" height="60" rx="12" fill="#F8FAFB"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#5A6B7A">13:00</text>
      <text x="12" y="40" font-size="10" fill="#92A1AE">1h 30m</text>
      <g transform="translate(56, 18)">
        <circle cx="12" cy="12" r="12" fill="#FF7A59" opacity="0.18"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" fill="#FF7A59">🍴</text>
      </g>
      <text x="92" y="26" font-size="14" font-weight="600" fill="#0F1F2E">Lunch at Hungarikum Bisztró</text>
      <text x="92" y="44" font-size="12" fill="#5A6B7A">~8,500 HUF · Planned</text>
      <circle cx="306" cy="30" r="4" fill="#F2A93B"/>
    </g>
  </g>

  <!-- FAB -->
  <g transform="translate(323, 514)">
    <circle cx="0" cy="0" r="26" fill="#0E7C7B"/>
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
