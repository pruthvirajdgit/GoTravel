<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>14 — Live presence on map</title>

  <!-- Map background -->
  <defs>
    <linearGradient id="mapBg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE8E6"/>
      <stop offset="1" stop-color="#C4D8D7"/>
    </linearGradient>
    <pattern id="mapGrid14" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0 L 40 0 M0 0 L 0 40" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="375" height="812" fill="url(#mapBg14)"/>
  <rect width="375" height="812" fill="url(#mapGrid14)"/>
  <path d="M-20 280 Q60 240 140 270 T320 290 L395 320 v100 H-20 Z" fill="#B6D6D4" opacity="0.7"/>
  <path d="M0 380 Q80 360 140 420 Q200 480 280 450 Q340 430 380 460" stroke="#9DC3E6" stroke-width="14" fill="none" opacity="0.55" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.7" fill="none" stroke-linecap="round">
    <path d="M-10 200 L200 280 L380 230"/>
    <path d="M40 100 L120 320 L200 580"/>
  </g>

  <!-- Route polyline -->
  <path d="M90 280 L150 320 L210 360 L260 410 L210 470 L160 500" stroke="#0E7C7B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pins -->
  <g transform="translate(80, 256)">
    <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#0E7C7B"/>
    <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
  </g>
  <g transform="translate(140, 296)">
    <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#FF7A59"/>
    <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
  </g>
  <g transform="translate(200, 336)">
    <path d="M0 16 a16 16 0 1 1 32 0 c0 12 -16 32 -16 32 s-16 -20 -16 -32z" fill="#2DA771"/>
    <circle cx="16" cy="16" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Top bar -->
  <g transform="translate(16, 56)">
    <rect width="343" height="56" rx="16" fill="#FFFFFF" filter="url(#shadow14)"/>
    <defs>
      <filter id="shadow14" x="-10%" y="-10%" width="120%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F1F2E" flood-opacity="0.10"/>
      </filter>
    </defs>
    <g transform="translate(16, 20)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,4 4,14 14,24"/>
    </g>
    <text x="46" y="26" font-size="15" font-weight="600" fill="#0F1F2E">Budapest → Croatia</text>
    <text x="46" y="42" font-size="12" fill="#5A6B7A">Day 3 · Tue Jun 16</text>

    <!-- Live presence stack -->
    <g transform="translate(220, 14)">
      <g>
        <circle cx="14" cy="14" r="14" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2"/>
        <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">A</text>
      </g>
      <g transform="translate(20, 0)">
        <circle cx="14" cy="14" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
        <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">J</text>
      </g>
      <g transform="translate(40, 0)">
        <circle cx="14" cy="14" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
        <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">L</text>
      </g>
      <!-- live dot -->
      <circle cx="68" cy="14" r="3" fill="#2DA771"/>
      <text x="76" y="18" font-size="11" font-weight="700" fill="#2DA771">LIVE · 3</text>
    </g>
  </g>

  <!-- Anna's cursor + pulse on a pin (the Baths) -->
  <g transform="translate(200, 336)">
    <!-- Pulse rings (animated visual approximation, static) -->
    <circle cx="16" cy="16" r="38" fill="#0EA5E9" opacity="0.10"/>
    <circle cx="16" cy="16" r="28" fill="#0EA5E9" opacity="0.20"/>
    <circle cx="16" cy="16" r="22" fill="#0EA5E9" opacity="0.30"/>
  </g>
  <!-- Anna name tag -->
  <g transform="translate(220, 320)">
    <rect width="120" height="28" rx="14" fill="#0EA5E9"/>
    <circle cx="14" cy="14" r="9" fill="#FFFFFF"/>
    <text x="14" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0EA5E9">A</text>
    <text x="30" y="18" font-size="11" font-weight="600" fill="#FFFFFF">Anna is editing</text>
  </g>

  <!-- James's cursor on map -->
  <g transform="translate(110, 440)">
    <!-- Arrow cursor -->
    <path d="M0 0 L0 16 L4 12 L7 18 L10 17 L7 11 L13 11 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <rect width="68" height="22" rx="11" fill="#10B981"/>
      <text x="34" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">James</text>
    </g>
  </g>

  <!-- Leo's cursor on map -->
  <g transform="translate(270, 280)">
    <path d="M0 0 L0 16 L4 12 L7 18 L10 17 L7 11 L13 11 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <rect width="58" height="22" rx="11" fill="#F59E0B"/>
      <text x="29" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Leo</text>
    </g>
  </g>

  <!-- Live activity toast -->
  <g transform="translate(16, 128)">
    <rect width="343" height="48" rx="14" fill="#0F1F2E"/>
    <circle cx="22" cy="24" r="10" fill="#0EA5E9"/>
    <text x="22" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">A</text>
    <text x="42" y="22" font-size="12" font-weight="600" fill="#FFFFFF">Anna added a price to "Dinner at Mazel Tov"</text>
    <text x="42" y="38" font-size="11" fill="#FFFFFF" opacity="0.65">just now · Day 3</text>
    <text x="318" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#0EA5E9">View</text>
  </g>

  <!-- Bottom sheet (peek) -->
  <g transform="translate(0, 568)">
    <rect width="375" height="244" rx="24" fill="#FFFFFF" filter="url(#shadowSheet14)"/>
    <defs>
      <filter id="shadowSheet14" x="-5%" y="-30%" width="110%" height="120%">
        <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#0F1F2E" flood-opacity="0.10"/>
      </filter>
    </defs>
    <rect x="167.5" y="8" width="40" height="4" rx="2" fill="#E5EBF0"/>

    <g transform="translate(24, 28)">
      <text font-size="20" font-weight="700" fill="#0F1F2E">Day 3 · Budapest</text>
      <text y="22" font-size="13" fill="#5A6B7A">3 collaborators online · last edit 2s ago</text>
    </g>

    <!-- Item with edit indicator -->
    <g transform="translate(24, 96)">
      <rect width="327" height="60" rx="12" fill="#F8FAFB"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#5A6B7A">19:30</text>
      <text x="12" y="40" font-size="10" fill="#92A1AE">2h</text>
      <g transform="translate(56, 18)">
        <circle cx="12" cy="12" r="12" fill="#FF7A59" opacity="0.18"/>
        <text x="12" y="17" text-anchor="middle" font-size="11" fill="#FF7A59">🍴</text>
      </g>
      <text x="92" y="26" font-size="14" font-weight="600" fill="#0F1F2E">Dinner at Mazel Tov</text>
      <text x="92" y="44" font-size="12" fill="#0EA5E9" font-weight="600">Anna is editing · price added</text>
      <g transform="translate(282, 18)">
        <circle cx="12" cy="12" r="14" fill="#0EA5E9" opacity="0.18"/>
        <circle cx="12" cy="12" r="12" fill="#0EA5E9"/>
        <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">A</text>
      </g>
    </g>

    <g transform="translate(24, 164)">
      <rect width="327" height="60" rx="12" fill="#F8FAFB"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#5A6B7A">16:00</text>
      <text x="12" y="40" font-size="10" fill="#92A1AE">1h</text>
      <g transform="translate(56, 18)">
        <circle cx="12" cy="12" r="12" fill="#F2A93B" opacity="0.18"/>
        <text x="12" y="17" text-anchor="middle" font-size="11" fill="#F2A93B">🏛</text>
      </g>
      <text x="92" y="26" font-size="14" font-weight="600" fill="#0F1F2E">Parliament tour</text>
      <text x="92" y="44" font-size="12" fill="#5A6B7A">9,000 HUF · Booked</text>
    </g>
  </g>

  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
