<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>13 — Share &amp; collaborators</title>

  <rect width="375" height="812" fill="#F8FAFB"/>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Top bar -->
  <g transform="translate(0, 56)">
    <g transform="translate(20, 0)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,4 4,14 14,24"/>
    </g>
    <text x="48" y="22" font-size="17" font-weight="600" fill="#0F1F2E">Share &amp; collaborate</text>
  </g>

  <!-- Section title -->
  <g transform="translate(24, 110)">
    <text font-size="13" font-weight="600" fill="#5A6B7A">INVITE LINK</text>
  </g>

  <!-- Invite link card -->
  <g transform="translate(24, 134)">
    <rect width="327" height="116" rx="16" fill="#FFFFFF"/>
    <!-- URL row -->
    <g transform="translate(16, 16)">
      <rect width="295" height="44" rx="10" fill="#EDF2F5"/>
      <text x="14" y="28" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#0F1F2E">gotravel.app/i/Td7Hy8…</text>
      <!-- Copy -->
      <g transform="translate(248, 10)">
        <rect width="40" height="24" rx="8" fill="#0E7C7B"/>
        <text x="20" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Copy</text>
      </g>
    </g>
    <!-- Role + expiry -->
    <g transform="translate(16, 72)">
      <rect width="138" height="32" rx="10" fill="#FFFFFF" stroke="#E5EBF0"/>
      <text x="14" y="20" font-size="12" font-weight="600" fill="#0F1F2E">Can edit</text>
      <g transform="translate(120, 12)" stroke="#5A6B7A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="0,0 4,4 8,0"/>
      </g>
    </g>
    <g transform="translate(160, 72)">
      <rect width="138" height="32" rx="10" fill="#FFFFFF" stroke="#E5EBF0"/>
      <text x="14" y="20" font-size="12" font-weight="600" fill="#0F1F2E">Expires in 7 days</text>
      <g transform="translate(120, 12)" stroke="#5A6B7A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="0,0 4,4 8,0"/>
      </g>
    </g>
  </g>

  <!-- Quick share row -->
  <g transform="translate(24, 270)">
    <g>
      <rect width="60" height="60" rx="14" fill="#FFFFFF"/>
      <text x="30" y="36" text-anchor="middle" font-size="22">💬</text>
      <text x="30" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#0F1F2E">Messages</text>
    </g>
    <g transform="translate(72, 0)">
      <rect width="60" height="60" rx="14" fill="#FFFFFF"/>
      <text x="30" y="36" text-anchor="middle" font-size="22">📧</text>
      <text x="30" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#0F1F2E">Email</text>
    </g>
    <g transform="translate(144, 0)">
      <rect width="60" height="60" rx="14" fill="#FFFFFF"/>
      <text x="30" y="38" text-anchor="middle" font-size="20">🟢</text>
      <text x="30" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#0F1F2E">WhatsApp</text>
    </g>
    <g transform="translate(216, 0)">
      <rect width="60" height="60" rx="14" fill="#FFFFFF"/>
      <g transform="translate(20, 20)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 0 v14 M4 8 l6 6 6 -6 M0 16 h20"/>
      </g>
      <text x="30" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#0F1F2E">More</text>
    </g>
  </g>

  <!-- People -->
  <g transform="translate(24, 376)">
    <text font-size="13" font-weight="600" fill="#5A6B7A">PEOPLE ON THIS TRIP · 4</text>
  </g>

  <!-- Member rows -->
  <g transform="translate(24, 400)">
    <rect width="327" height="280" rx="16" fill="#FFFFFF"/>

    <!-- Maya (owner, you) -->
    <g transform="translate(16, 16)">
      <circle cx="20" cy="20" r="20" fill="#4F46E5"/>
      <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">M</text>
      <!-- presence dot -->
      <circle cx="34" cy="34" r="6" fill="#2DA771" stroke="#FFFFFF" stroke-width="2"/>
      <text x="52" y="18" font-size="14" font-weight="600" fill="#0F1F2E">Maya Hernandez</text>
      <text x="100" y="18" font-size="11" font-weight="600" fill="#0E7C7B">(you)</text>
      <text x="52" y="36" font-size="12" fill="#5A6B7A">maya@example.com</text>
      <g transform="translate(248, 10)">
        <rect width="50" height="22" rx="11" fill="#0E7C7B"/>
        <text x="25" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">OWNER</text>
      </g>
    </g>

    <line x1="16" y1="72" x2="311" y2="72" stroke="#E5EBF0"/>

    <!-- Anna -->
    <g transform="translate(16, 84)">
      <circle cx="20" cy="20" r="20" fill="#0EA5E9"/>
      <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">A</text>
      <circle cx="34" cy="34" r="6" fill="#2DA771" stroke="#FFFFFF" stroke-width="2"/>
      <text x="52" y="18" font-size="14" font-weight="600" fill="#0F1F2E">Anna Kovács</text>
      <text x="52" y="36" font-size="12" fill="#5A6B7A">Editing now · Day 3 dinner</text>
      <g transform="translate(248, 10)">
        <rect width="60" height="22" rx="11" fill="#EDF2F5"/>
        <text x="30" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#0F1F2E">EDITOR</text>
      </g>
    </g>

    <line x1="16" y1="140" x2="311" y2="140" stroke="#E5EBF0"/>

    <!-- James -->
    <g transform="translate(16, 152)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">J</text>
      <text x="52" y="18" font-size="14" font-weight="600" fill="#0F1F2E">James O'Brien</text>
      <text x="52" y="36" font-size="12" fill="#5A6B7A">james@example.com · last seen 2h ago</text>
      <g transform="translate(248, 10)">
        <rect width="60" height="22" rx="11" fill="#EDF2F5"/>
        <text x="30" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#0F1F2E">EDITOR</text>
      </g>
    </g>

    <line x1="16" y1="208" x2="311" y2="208" stroke="#E5EBF0"/>

    <!-- Leo -->
    <g transform="translate(16, 220)">
      <circle cx="20" cy="20" r="20" fill="#F59E0B"/>
      <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">L</text>
      <text x="52" y="18" font-size="14" font-weight="600" fill="#0F1F2E">Leo Park</text>
      <text x="52" y="36" font-size="12" fill="#5A6B7A">Can leave comments only</text>
      <g transform="translate(228, 10)">
        <rect width="80" height="22" rx="11" fill="#EDF2F5"/>
        <text x="40" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#0F1F2E">COMMENTER</text>
      </g>
    </g>
  </g>

  <!-- Footer note + view link -->
  <g transform="translate(187.5, 706)" text-anchor="middle">
    <text font-size="13" font-weight="600" fill="#0E7C7B">Create a read-only link instead →</text>
  </g>

  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
