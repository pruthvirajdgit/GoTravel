      <text x="24" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.85">DAY 3</text>
      <text x="24" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">16</text>
