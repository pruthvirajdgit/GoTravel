      <text x="24" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6B7A">DAY 4</text>
      <text x="24" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0F1F2E">17</text>
