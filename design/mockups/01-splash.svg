<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>01 — Splash</title>

  <!-- Device frame background -->
  <rect width="375" height="812" fill="#0E7C7B"/>

  <!-- Soft gradient overlay -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7C7B"/>
      <stop offset="1" stop-color="#0A5F5E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="375" height="812" fill="url(#g)"/>
  <rect width="375" height="812" fill="url(#halo)"/>

  <!-- Status bar (dark mode for splash) -->
  <g fill="#FFFFFF">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <!-- signal -->
    <g transform="translate(310,18)">
      <rect x="0" y="6" width="3" height="3" rx="0.5"/>
      <rect x="5" y="4" width="3" height="5" rx="0.5"/>
      <rect x="10" y="2" width="3" height="7" rx="0.5"/>
      <rect x="15" y="0" width="3" height="9" rx="0.5"/>
    </g>
    <!-- wifi -->
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- battery -->
    <g transform="translate(348,19)">
      <rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="22" y="3" width="2" height="4" rx="0.5"/>
      <rect x="2" y="2" width="14" height="6" rx="1"/>
    </g>
  </g>

  <!-- Logo block - centered -->
  <g transform="translate(187.5, 360)">
    <!-- Pin mark -->
    <g transform="translate(-44, -100)">
      <circle cx="22" cy="22" r="22" fill="#FF7A59"/>
      <circle cx="22" cy="22" r="9" fill="#FFFFFF"/>
    </g>
    <text text-anchor="middle" y="0" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-1">GoTravel</text>
    <text text-anchor="middle" y="42" font-size="16" font-weight="400" fill="#FFFFFF" opacity="0.78">Plan together. Travel together.</text>
  </g>

  <!-- Loading indicator -->
  <g transform="translate(187.5, 720)">
    <circle cx="-20" cy="0" r="4" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="0"   cy="0" r="4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="20"  cy="0" r="4" fill="#FFFFFF" opacity="1.0"/>
  </g>

  <!-- Home indicator -->
  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85"/>
</svg>
