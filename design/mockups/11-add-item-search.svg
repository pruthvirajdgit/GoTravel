  <!-- Bottom keyboard hint (peek) -->
  <g transform="translate(0, 692)">
    <rect width="375" height="86" fill="#E5EBF0"/>
    <rect x="170" y="8" width="36" height="4" rx="2" fill="#92A1AE" opacity="0.5"/>
    <text x="187.5" y="44" text-anchor="middle" font-size="13" fill="#5A6B7A">[keyboard]</text>
  </g>

  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
