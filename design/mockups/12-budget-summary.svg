<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>12 — Budget summary</title>

  <rect width="375" height="812" fill="#F8FAFB"/>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Top bar -->
  <g transform="translate(0, 56)">
    <g transform="translate(20, 0)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,4 4,14 14,24"/>
    </g>
    <text x="48" y="22" font-size="17" font-weight="600" fill="#0F1F2E">Budget</text>
    <!-- Currency switch -->
    <g transform="translate(288, 0)">
      <rect width="64" height="32" rx="16" fill="#FFFFFF" stroke="#E5EBF0"/>
      <text x="20" y="20" font-size="12" font-weight="600" fill="#0F1F2E">EUR</text>
      <g transform="translate(46, 12)" stroke="#5A6B7A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="0,0 4,4 8,0"/>
      </g>
    </g>
  </g>

  <!-- Hero total card -->
  <g transform="translate(24, 116)">
    <defs>
      <linearGradient id="totalBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0E7C7B"/>
        <stop offset="1" stop-color="#0A5F5E"/>
      </linearGradient>
    </defs>
    <rect width="327" height="156" rx="20" fill="url(#totalBg)"/>
    <text x="20" y="32" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.75">TOTAL PLANNED</text>
    <text x="20" y="74" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-1">€2,840</text>
    <text x="20" y="98" font-size="13" fill="#FFFFFF" opacity="0.75">across 41 items · 4 travelers</text>

    <!-- Per person -->
    <g transform="translate(20, 116)">
      <rect width="120" height="28" rx="14" fill="#FFFFFF" opacity="0.18"/>
      <text x="60" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">€710 per person</text>
    </g>
    <g transform="translate(148, 116)">
      <rect width="160" height="28" rx="14" fill="#FFFFFF" opacity="0.18"/>
      <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">€218 / day average</text>
    </g>
  </g>

  <!-- Categories breakdown -->
  <g transform="translate(24, 292)">
    <text font-size="13" font-weight="600" fill="#5A6B7A">BY CATEGORY</text>
  </g>

  <g transform="translate(24, 316)">
    <rect width="327" height="200" rx="16" fill="#FFFFFF"/>

    <!-- Lodging -->
    <g transform="translate(16, 20)">
      <rect width="24" height="24" rx="6" fill="#0E7C7B" opacity="0.15"/>
      <text x="12" y="17" text-anchor="middle" font-size="14" fill="#0E7C7B">🏨</text>
      <text x="36" y="12" font-size="13" font-weight="600" fill="#0F1F2E">Hotels &amp; lodging</text>
      <text x="36" y="28" font-size="11" fill="#5A6B7A">9 items</text>
      <text x="280" y="20" font-size="14" font-weight="700" fill="#0F1F2E">€1,260</text>
      <!-- bar -->
      <rect x="36" y="34" width="244" height="6" rx="3" fill="#EDF2F5"/>
      <rect x="36" y="34" width="108" height="6" rx="3" fill="#0E7C7B"/>
    </g>

    <!-- Transport -->
    <g transform="translate(16, 70)">
      <rect width="24" height="24" rx="6" fill="#3E7BFA" opacity="0.15"/>
      <text x="12" y="17" text-anchor="middle" font-size="14" fill="#3E7BFA">✈</text>
      <text x="36" y="12" font-size="13" font-weight="600" fill="#0F1F2E">Transport (flights, trains)</text>
      <text x="36" y="28" font-size="11" fill="#5A6B7A">6 items</text>
      <text x="280" y="20" font-size="14" font-weight="700" fill="#0F1F2E">€780</text>
      <rect x="36" y="34" width="244" height="6" rx="3" fill="#EDF2F5"/>
      <rect x="36" y="34" width="68" height="6" rx="3" fill="#3E7BFA"/>
    </g>

    <!-- Food -->
    <g transform="translate(16, 120)">
      <rect width="24" height="24" rx="6" fill="#FF7A59" opacity="0.15"/>
      <text x="12" y="17" text-anchor="middle" font-size="14" fill="#FF7A59">🍴</text>
      <text x="36" y="12" font-size="13" font-weight="600" fill="#0F1F2E">Food &amp; drink</text>
      <text x="36" y="28" font-size="11" fill="#5A6B7A">14 items</text>
      <text x="280" y="20" font-size="14" font-weight="700" fill="#0F1F2E">€500</text>
      <rect x="36" y="34" width="244" height="6" rx="3" fill="#EDF2F5"/>
      <rect x="36" y="34" width="42" height="6" rx="3" fill="#FF7A59"/>
    </g>

    <!-- Activities -->
    <g transform="translate(16, 170)">
      <rect width="24" height="24" rx="6" fill="#2DA771" opacity="0.15"/>
      <text x="12" y="17" text-anchor="middle" font-size="14" fill="#2DA771">★</text>
      <text x="36" y="12" font-size="13" font-weight="600" fill="#0F1F2E">Activities &amp; landmarks</text>
      <text x="36" y="28" font-size="11" fill="#5A6B7A">12 items</text>
      <text x="280" y="20" font-size="14" font-weight="700" fill="#0F1F2E">€300</text>
      <rect x="36" y="34" width="244" height="6" rx="3" fill="#EDF2F5" opacity="0"/>
    </g>
  </g>

  <!-- By currency -->
  <g transform="translate(24, 540)">
    <text font-size="13" font-weight="600" fill="#5A6B7A">ORIGINAL CURRENCIES</text>
  </g>

  <g transform="translate(24, 564)">
    <rect width="327" height="120" rx="16" fill="#FFFFFF"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="12" fill="#0E7C7B" opacity="0.10"/>
      <text x="24" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C7B">HUF</text>
    </g>
    <g transform="translate(76, 24)">
      <text font-size="14" font-weight="700" fill="#0F1F2E">680,000 HUF</text>
      <text y="18" font-size="11" fill="#5A6B7A">11 items · ≈ €1,700</text>
    </g>
    <text x="306" y="48" text-anchor="end" font-size="12" fill="#92A1AE">1 EUR ≈ 400 HUF</text>

    <line x1="16" y1="68" x2="311" y2="68" stroke="#E5EBF0"/>

    <g transform="translate(76, 88)">
      <rect width="32" height="22" rx="8" fill="#0E7C7B" opacity="0.10" x="-60"/>
      <text x="-44" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#0E7C7B">CZK</text>
      <text font-size="14" font-weight="700" fill="#0F1F2E">8,400 CZK · ≈ €340</text>
      <text x="170" font-size="11" fill="#5A6B7A">7 items</text>
    </g>
  </g>

  <!-- Bottom nav -->
  <g transform="translate(0, 729)">
    <rect width="375" height="49" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E5EBF0"/>
    <g transform="translate(57, 8)" stroke="#92A1AE" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(8, 4)"><path d="M2 2 h16 v16 h-16 z"/><path d="M6 6 h8 M6 10 h8 M6 14 h5"/></g>
      <text x="18" y="42" text-anchor="middle" font-size="11" fill="#5A6B7A" stroke="none">Trips</text>
    </g>
    <g transform="translate(157, 8)" stroke="#92A1AE" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(8, 4)"><path d="M2 4 l6 -2 l6 2 l4 -2 v14 l-4 2 l-6 -2 l-6 2 z"/><path d="M8 2 v16 M14 4 v16"/></g>
      <text x="18" y="42" text-anchor="middle" font-size="11" fill="#5A6B7A" stroke="none">Map</text>
    </g>
    <g transform="translate(257, 8)" stroke="#92A1AE" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(8, 6)"><path d="M2 6 h16 v10 h-16 z"/><path d="M2 6 l8 6 l8 -6"/></g>
      <text x="18" y="42" text-anchor="middle" font-size="11" fill="#5A6B7A" stroke="none">Inbox</text>
    </g>
    <g transform="translate(317, 8)">
      <circle cx="18" cy="14" r="10" fill="#4F46E5"/>
      <text x="18" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">M</text>
      <text x="18" y="42" text-anchor="middle" font-size="11" fill="#5A6B7A">Me</text>
    </g>
  </g>

  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
