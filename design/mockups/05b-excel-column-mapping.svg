<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>05b — Excel upload: column mapping preview</title>

  <rect width="375" height="812" fill="#F8FAFB"/>

  <!-- Status bar -->
  <g fill="#0F1F2E">
    <text x="32" y="29" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(310,18)"><rect x="0" y="6" width="3" height="3" rx="0.5"/><rect x="5" y="4" width="3" height="5" rx="0.5"/><rect x="10" y="2" width="3" height="7" rx="0.5"/><rect x="15" y="0" width="3" height="9" rx="0.5"/></g>
    <path d="M335 19 q5 -5 10 0 M337 22 q3 -3 6 0 M340 25 l0 1" stroke="#0F1F2E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(348,19)"><rect x="0" y="0" width="22" height="10" rx="2" fill="none" stroke="#0F1F2E" stroke-width="1"/><rect x="22" y="3" width="2" height="4" rx="0.5" fill="#0F1F2E"/><rect x="2" y="2" width="14" height="6" rx="1" fill="#0F1F2E"/></g>
  </g>

  <!-- Top app bar -->
  <g transform="translate(0, 56)">
    <g transform="translate(20, 0)" stroke="#0F1F2E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14,4 4,14 14,24"/>
    </g>
    <text x="48" y="20" font-size="17" font-weight="600" fill="#0F1F2E">Map your columns</text>
    <text x="48" y="38" font-size="13" fill="#5A6B7A">Step 2 of 3 · gotravel-trip.xlsx</text>
  </g>

  <!-- Stepper -->
  <g transform="translate(24, 122)">
    <rect width="327" height="4" rx="2" fill="#E5EBF0"/>
    <rect width="218" height="4" rx="2" fill="#0E7C7B"/>
  </g>

  <!-- File summary banner -->
  <g transform="translate(24, 144)">
    <rect width="327" height="56" rx="12" fill="#0E7C7B" opacity="0.08"/>
    <g transform="translate(16, 16)" stroke="#0E7C7B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="8,12 11,15 16,9"/>
    </g>
    <text x="52" y="26" font-size="14" font-weight="600" fill="#0F1F2E">Found 41 rows across 5 sheets</text>
    <text x="52" y="44" font-size="12" fill="#5A6B7A">7 of 8 columns auto-mapped · review &amp; fix below</text>
  </g>

  <!-- Section header -->
  <g transform="translate(24, 220)">
    <text font-size="13" font-weight="600" fill="#5A6B7A">COLUMN MAPPING</text>
  </g>

  <!-- Column rows -->
  <g transform="translate(24, 244)" font-size="13">
    <!-- Row 1: auto-mapped -->
    <g transform="translate(0, 0)">
      <rect width="327" height="56" rx="12" fill="#FFFFFF"/>
      <text x="16" y="22" font-weight="600" fill="#0F1F2E">"Day"</text>
      <text x="16" y="40" fill="#92A1AE">3 · 4 · 5 …</text>
      <g transform="translate(140, 24)" stroke="#92A1AE" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="32" font-weight="600" fill="#0E7C7B">day_number</text>
      <g transform="translate(298, 22)" fill="#2DA771">
        <circle cx="6" cy="6" r="6"/>
        <polyline points="3,6 5,8 9,4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 64)">
      <rect width="327" height="56" rx="12" fill="#FFFFFF"/>
      <text x="16" y="22" font-weight="600" fill="#0F1F2E">"Date"</text>
      <text x="16" y="40" fill="#92A1AE">2026-06-14 …</text>
      <g transform="translate(140, 24)" stroke="#92A1AE" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="32" font-weight="600" fill="#0E7C7B">date</text>
      <g transform="translate(298, 22)" fill="#2DA771">
        <circle cx="6" cy="6" r="6"/>
        <polyline points="3,6 5,8 9,4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Row 3: ambiguous - needs review -->
    <g transform="translate(0, 128)">
      <rect width="327" height="64" rx="12" fill="#FFFFFF" stroke="#F2A93B" stroke-width="1.5"/>
      <text x="16" y="22" font-weight="600" fill="#0F1F2E">"What"</text>
      <text x="16" y="40" fill="#92A1AE">Széchenyi Baths …</text>
      <g transform="translate(140, 24)" stroke="#F2A93B" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="22" font-weight="600" fill="#F2A93B">activity_name</text>
      <text x="172" y="40" font-size="11" fill="#5A6B7A">Tap to change</text>
      <g transform="translate(294, 28)" stroke="#F2A93B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="0,2 8,2 4,8 4,12"/>
        <circle cx="4" cy="16" r="1" fill="#F2A93B"/>
      </g>
    </g>
    <!-- Row 4 -->
    <g transform="translate(0, 200)">
      <rect width="327" height="56" rx="12" fill="#FFFFFF"/>
      <text x="16" y="22" font-weight="600" fill="#0F1F2E">"Cost (HUF)"</text>
      <text x="16" y="40" fill="#92A1AE">12,000 · 4,500 …</text>
      <g transform="translate(140, 24)" stroke="#92A1AE" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="32" font-weight="600" fill="#0E7C7B">budget_amount + HUF</text>
      <g transform="translate(298, 22)" fill="#2DA771">
        <circle cx="6" cy="6" r="6"/>
        <polyline points="3,6 5,8 9,4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Row 5 -->
    <g transform="translate(0, 264)">
      <rect width="327" height="56" rx="12" fill="#FFFFFF"/>
      <text x="16" y="22" font-weight="600" fill="#0F1F2E">"Notes"</text>
      <text x="16" y="40" fill="#92A1AE">Bring swimsuit …</text>
      <g transform="translate(140, 24)" stroke="#92A1AE" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="32" font-weight="600" fill="#0E7C7B">notes</text>
      <g transform="translate(298, 22)" fill="#2DA771">
        <circle cx="6" cy="6" r="6"/>
        <polyline points="3,6 5,8 9,4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Row 6: unmapped/skip -->
    <g transform="translate(0, 328)">
      <rect width="327" height="56" rx="12" fill="#FFFFFF" opacity="0.6"/>
      <text x="16" y="22" font-weight="600" fill="#5A6B7A">"My color code"</text>
      <text x="16" y="40" fill="#92A1AE">red · blue · green …</text>
      <g transform="translate(140, 24)" stroke="#92A1AE" stroke-width="1.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="16" y2="4"/>
        <polyline points="12,0 16,4 12,8"/>
      </g>
      <text x="172" y="32" font-weight="600" fill="#92A1AE">— skip —</text>
    </g>
  </g>

  <!-- Bottom CTA bar -->
  <g transform="translate(0, 644)">
    <rect width="375" height="120" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E5EBF0"/>
    <g transform="translate(24, 20)">
      <rect width="327" height="56" rx="12" fill="#0E7C7B"/>
      <text x="163.5" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Import 41 items</text>
    </g>
    <text x="187.5" y="100" text-anchor="middle" font-size="12" fill="#5A6B7A">You can edit anything after import.</text>
  </g>

  <!-- Home indicator -->
  <rect x="121" y="800" width="134" height="5" rx="2.5" fill="#0F1F2E" opacity="0.85"/>
</svg>
